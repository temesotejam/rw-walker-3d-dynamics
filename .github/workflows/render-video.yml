name: Render rear-hip motion
on:
  push:
    branches: [video/rear-hip-4mm]
  workflow_dispatch:
    inputs:
      viewer_url:
        description: "Temporary HTTPS URL of the self-contained viewer HTML for this run"
        required: true
        type: string
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch transient input
        env:
          WALKER_VIEWER_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-2078-8206-bef6-ab08040f763c/raw?se=2026-10-26T12%3A07%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=341fd5e1-9511-4d7a-a753-18d5d8d9e223&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-26T00%3A01%3A22Z&ske=2026-10-27T00%3A01%3A22Z&sks=b&skv=2026-02-06&sig=p0WFrFZFAxpO4UUDiYxlcPxuALTYm3q9gTkFRlpl9kg%3D"
        run: |
          mkdir -p viewer
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --max-time 120 "$WALKER_VIEWER_URL" -o viewer/rear-hip-4mm.html
          test -s viewer/rear-hip-4mm.html
      - name: Install Chromium and renderer
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Install portable FFmpeg
        run: |
          python -m pip install --quiet imageio-ffmpeg
          ln -s "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /tmp/ffmpeg
          echo /tmp >> "$GITHUB_PATH"
      - name: Render saved numerical trajectory
        run: node scripts/render.mjs
      - name: Encode MP4 and GIF
        run: |
          mkdir -p video
          ffmpeg -hide_banner -loglevel error -y -framerate 8 -i frames/frame_%03d.png -vf 'pad=ceil(iw/2)*2:ceil(ih/2)*2' -c:v libx264 -crf 22 -pix_fmt yuv420p -movflags +faststart video/rear-hip-4mm.mp4
          ffmpeg -hide_banner -loglevel error -y -framerate 8 -i frames/frame_%03d.png -vf 'fps=8,scale=640:-1:flags=lanczos,palettegen' video/palette.png
          ffmpeg -hide_banner -loglevel error -y -framerate 8 -i frames/frame_%03d.png -i video/palette.png -filter_complex 'fps=8,scale=640:-1:flags=lanczos[x];[x][1:v]paletteuse' video/rear-hip-4mm.gif
          test -s video/rear-hip-4mm.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: rear-hip-4mm-motion
          path: video/rear-hip-4mm.*
          retention-days: 30
